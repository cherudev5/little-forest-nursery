<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/Little Logo.png" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>Little Forest Nursery | Quality Tree Seedlings in Kenya</title>

    <meta
      name="description"
      content="Little Forest Nursery provides quality tree seedlings across Kenya for families, farms, schools, communities, and environmental restoration."
    />

    <meta
      name="author"
      content="Little Forest Nursery"
    />

    <!-- Search Engine Crawling -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://www.littleforestke.com/"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#2e7d32"
    />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Little Forest Nursery | Growing a Greener Kenya"
    />

    <meta
      property="og:description"
      content="Quality tree seedlings for families, farms, schools, and communities across Kenya."
    />

    <meta
      property="og:url"
      content="https://www.littleforestke.com/"
    />

    <meta
      property="og:site_name"
      content="Little Forest Nursery"
    />

    <meta
      property="og:image"
      content="https://www.littleforestke.com/Little%20Logo.png"
    />

    <meta
      property="og:image:alt"
      content="Little Forest Nursery logo"
    />

    <meta
      property="og:locale"
      content="en_KE"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Little Forest Nursery | Growing a Greener Kenya"
    />

    <meta
      name="twitter:description"
      content="Quality tree seedlings for families, farms, schools, and communities across Kenya."
    />

    <meta
      name="twitter:image"
      content="https://www.littleforestke.com/Little%20Logo.png"
    />

    <meta
      name="twitter:image:alt"
      content="Little Forest Nursery logo"
    />

    <!-- Structured Data: Garden Store -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "GardenStore",
        "name": "Little Forest Nursery",
        "description": "Little Forest Nursery provides quality tree seedlings for families, farms, schools, communities, and environmental restoration across Kenya.",
        "url": "https://www.littleforestke.com/",
        "logo": "https://www.littleforestke.com/Little%20Logo.png",
        "image": "https://www.littleforestke.com/Little%20Logo.png",
        "areaServed": {
          "@type": "Country",
          "name": "Kenya"
        }
      }
    </script>

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Little Forest Nursery",
        "url": "https://www.littleforestke.com/",
        "logo": "https://www.littleforestke.com/Little%20Logo.png"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
